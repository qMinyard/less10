<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="js.js" defer></script>
</head>
<body>
    <header>
        <h1>CHINA TOWN</h1>
        <img src="lantern.svg" alt="img" class="lantern left" >
        <img src="lantern.svg" alt="img" class="lantern right">
    </header>

    <main>
        <div class="house">
            <img class="roof" src="roof.svg" alt="">
            <div class="block">
                <div class="window">
                    <h2>Chef</h2>
                    <img src="chef.jpg" alt="">
                </div>
            </div>
        </div>
        <div class="house">
            <img class="roof" src="roof.svg" alt="">
            <div class="block">
                <div class="window">
                    <h2>Menu</h2>
                    <ul class="menu-list">
                        <li>dfsf</li>
                        <li>fdsfs</li>
                        <li>dfsdf</li>
                        <li>sfsdfwee</li>
                    </ul>
                </div>
            </div>
        </div>
    </main>

    <section class="order">
        <h2 class="order">order</h2>
        <form action="" id="order-form">
            <label for="dish">Dish:</label>
            <input type="text" placeholder="dsfsdf" id="dish">
            <label for="time">Time:</label>
            <input type="time" id="time">
            <label for="adress">Adress:</label>
            <input type="adress" placeholder="dsfsdf" id="adress">
            <label for="tel">Tel:</label>
            <input type="tel" placeholder="dsfsdf" id="tel"> 
            <input type="submit" id="submit" value="order">
        </form>
    </section>
</body>
</html>
